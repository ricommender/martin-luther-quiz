<script>
'use strict';
const lessons=[
{icon:'👶',name:'Wer war Martin Luther?',text:'Stell dir vor: Wir reisen über 500 Jahre zurück! In der Stadt Eisleben wird am 10. November 1483 ein Junge geboren. Sein Name: Martin Luther. Später wird er richtig berühmt, weil er die Kirche verändern will.',key:'1483 · Eisleben',theme:'blue',q:'Wo wurde Martin Luther geboren?',options:['In Eisleben','In Berlin','In Rom'],answer:0,why:'Luther wurde 1483 in Eisleben geboren.'},
{icon:'⛈️',name:'Das Gewitter',text:'Blitz! Donner! Als junger Mann steckt Martin mitten in einem Gewitter. Er bekommt große Angst. Er verspricht: Wenn ich heil nach Hause komme, werde ich Mönch! Und tatsächlich: Er geht ins Kloster.',key:'Luther wurde Mönch.',theme:'orange',q:'Was tat Luther nach dem Gewitter?',options:['Er wurde König.','Er trat in ein Kloster ein.','Er baute ein Schiff.'],answer:1,why:'Das Gewitter war ein wichtiger Anlass für seinen Entschluss, Mönch zu werden.'},
{icon:'⛪',name:'Leben im Kloster',text:'Im Kloster betet Martin ganz viel. Er liest in der Bibel und macht sich Sorgen: Bin ich gut genug für Gott? Liebt Gott mich überhaupt? Diese Frage lässt ihn nicht los.',key:'Martin wollte wissen: Liebt Gott mich?',theme:'green',q:'Welche Frage beschäftigte Luther besonders?',options:['Wie werde ich reich?','Wie gewinne ich ein Rennen?','Wie kann ich sicher sein, dass Gott mich liebt?'],answer:2,why:'Luther wollte verstehen, wie Gott zu den Menschen steht.'},
{icon:'📖',name:'Eine wichtige Entdeckung',text:'Dann entdeckt Martin etwas Tolles in der Bibel: Gott liebt die Menschen einfach so! Dafür muss niemand Geld bezahlen oder perfekt sein. Das nennt man Gnade. Das bedeutet: Gott liebt uns und kann uns verzeihen.',key:'Gottes Liebe ist ein Geschenk.',theme:'blue',q:'Was bedeutet Gnade hier?',options:['Gott liebt und vergibt.','Man muss Gott Geld geben.','Nur Könige werden geliebt.'],answer:0,why:'Für Luther war Gottes Gnade ein Geschenk.'},
{icon:'💰',name:'Was sind Ablassbriefe?',text:'Stell dir vor, jemand sagt: Zahl Geld, dann bekommst du weniger Strafe für deine Sünden! Solche Ablassbriefe gab es damals. Martin findet das überhaupt nicht gut. Er sagt: Gottes Vergebung kann man nicht kaufen!',key:'Gottes Vergebung kann man nicht kaufen.',theme:'orange',q:'Warum kritisierte Luther den Ablasshandel?',options:['Weil Papier zu teuer war.','Weil Gottes Vergebung nicht gekauft werden kann.','Weil niemand schreiben durfte.'],answer:1,why:'Luther war gegen die Vorstellung, durch Geld Gottes Vergebung erwerben zu können.'},
{icon:'📜',name:'Die 95 Thesen',text:'Martin schreibt 95 wichtige Sätze auf. Sie heißen Thesen. Darin erklärt er, was in der Kirche falsch läuft. Am 31. Oktober 1517 macht er sie bekannt. Eine berühmte Geschichte erzählt, dass er sie an eine Kirchentür in Wittenberg schlägt. Ob das wirklich so war, weiß man nicht sicher.',key:'1517 · 95 Thesen · Wittenberg',theme:'green',q:'Wie viele Thesen machte Luther 1517 bekannt?',options:['15','50','95'],answer:2,why:'1517 veröffentlichte Luther seine 95 Thesen.'},
{icon:'👑',name:'Ärger mit der Kirche',text:'Jetzt gibt es richtig Ärger! Viele mächtige Leute sind sauer auf Martin. Im Jahr 1521 muss er sich in Worms vor Kaiser Karl V. erklären. Aber Martin bleibt bei seiner Meinung.',key:'1521 · Martin vor dem Kaiser',theme:'orange',q:'Vor wem sollte Luther 1521 in Worms seine Lehre erklären?',options:['Vor Kaiser Karl V.','Vor einem Fußballtrainer','Vor dem Bürgermeister von Eisleben'],answer:0,why:'Luther wurde 1521 zum Reichstag in Worms geladen.'},
{icon:'🏰',name:'Auf der Wartburg',text:'Martin ist in Gefahr. Ein mächtiger Freund bringt ihn auf der Wartburg in Sicherheit. Dort nennt Martin sich „Junker Jörg“. Er nutzt die Zeit und übersetzt das Neue Testament in die deutsche Sprache.',key:'Wartburg · Junker Jörg',theme:'blue',q:'Wie hieß Luther auf der Wartburg?',options:['König Martin','Junker Jörg','Ritter Franz'],answer:1,why:'Auf der Wartburg verwendete Luther den Namen Junker Jörg.'},
{icon:'📚',name:'Die Bibel auf Deutsch',text:'Stell dir vor, dein Lieblingsbuch wäre in einer Sprache geschrieben, die du gar nicht verstehst! So ging es vielen Menschen mit der Bibel. Martin übersetzt das Neue Testament ins Deutsche, damit sie es selbst lesen können.',key:'Die Bibel sollte verständlich sein.',theme:'green',q:'Warum übersetzte Luther das Neue Testament?',options:['Weil er Bücher sammeln wollte.','Damit es niemand lesen konnte.','Damit mehr Menschen es verstehen konnten.'],answer:2,why:'So konnten mehr Menschen selbst lesen, was in der Bibel steht.'},
{icon:'🌱',name:'Die Reformation',text:'Martin will, dass die Kirche sich verändert. Immer mehr Menschen hören ihm zu. Daraus entsteht eine große Bewegung: die Reformation. Das Wort bedeutet Erneuerung. Später gibt es auch evangelische Kirchen.',key:'Reformation = Erneuerung',theme:'green',q:'Was bedeutet Reformation?',options:['Erneuerung','Ferien','Eine Burg'],answer:0,why:'Reformation ist ein anderes Wort für Erneuerung.'}
];
const extra=[
{q:'In welchem Jahr wurde Luther geboren?',options:['1483','1517','1521'],answer:0,why:'Martin Luther wurde 1483 geboren.'},
{q:'Wann machte Luther seine 95 Thesen bekannt?',options:['1483','1517','1521'],answer:1,why:'Das war am 31. Oktober 1517.'},
{q:'Welche Stadt ist mit den 95 Thesen verbunden?',options:['Hamburg','München','Wittenberg'],answer:2,why:'Luther lebte und arbeitete in Wittenberg.'},
{q:'Wo übersetzte Luther das Neue Testament?',options:['Auf der Wartburg','Auf einem Schiff','In Rom'],answer:0,why:'Er arbeitete während seines Aufenthalts auf der Wartburg daran.'},
{q:'Was wollte Luther an der Kirche ändern?',options:['Alle Kirchen schließen','Probleme wie den Ablasshandel ändern','Nur noch Latein sprechen'],answer:1,why:'Luther wollte besonders den Ablasshandel kritisieren und die Kirche erneuern.'},
{q:'Was ist bei den 95 Thesen historisch sicher?',options:['Der Türanschlag ist zweifelsfrei bewiesen.','Luther schrieb nur 9 Thesen.','1517 wurden 95 Thesen veröffentlicht; der Türanschlag ist nicht sicher belegt.'],answer:2,why:'Die Veröffentlichung ist belegt. Der berühmte Anschlag an die Kirchentür ist historisch umstritten.'}
];
let mode='learn',index=0,answers={},examQuestions=[];const $=s=>document.querySelector(s),card=$('#card');
function shuffle(items){let a=[...items];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function setMode(m){$('#mode-options').hidden=true;$('#mode-toggle').setAttribute('aria-expanded','false');$('#mode-name').textContent=({learn:'📖 Lernkarten',practice:'⚡ Quiz',exam:'🎓 Klassenarbeit'})[m];mode=m;index=0;answers={};if(m==='exam')examQuestions=shuffle([...lessons.map(x=>({q:x.q,options:x.options,answer:x.answer,why:x.why})),...extra]).slice(0,12);document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',String(b.dataset.mode===m))});render()}
function add(tag,cls,txt,parent=card){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;parent.append(e);return e}
function finish(total){let correct=Object.values(answers).filter(a=>a.correct).length;card.className='card green';const wrap=add('div','result');add('div','visual',correct===total?'🏆':'🌟',wrap);add('h2','title',correct+' von '+total+' richtig!',wrap);add('p','',correct===total?'Klasse! Alle Fragen richtig.':correct>=total*.7?'Gut gemacht! Du weißt schon viel über Martin Luther.':'Übe die Lernkarten noch einmal und probiere es erneut.',wrap);add('div','stars','⭐'.repeat(Math.max(1,Math.round(correct/total*5))),wrap);const b=add('button','primary','Noch einmal üben',wrap);b.onclick=()=>setMode(mode);const l=add('button','secondary','Lernkarten ansehen',wrap);l.onclick=()=>setMode('learn')}
function render(){card.replaceChildren();const n=mode==='exam'?examQuestions.length:lessons.length;const end=index>=n;$('#meta-label').textContent=mode==='learn'?'✳ ERST VERSTEHEN':mode==='practice'?'✳ WISSEN TESTEN':'✳ PROBE-KLASSENARBEIT';$('#count').textContent=end?'ZIEL':String(index+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');$('#progress-fill').style.width=(end?100:(index+1)/n*100)+'%';$('#hint').textContent=mode==='learn'?'Wisch nach links oder tippe auf →':mode==='exam'?'12 gemischte Fragen · ohne Zeitdruck':'Wähle deine Antwort';$('#prev').disabled=index===0;$('#next').disabled=end||(mode!=='learn'&&!answers[index]);$('#next').textContent=index===n-1?'✓':'→';if(end){finish(n);return}if(mode==='learn'){const x=lessons[index];card.className='card '+x.theme;add('span','pill','✦ LERNKARTE '+String(index+1).padStart(2,'0'));add('div','visual',x.icon);const part=add('div');add('h2','title',x.name,part);add('p','body',x.text,part);add('p','remember','✳ MERKE DIR: '+x.key,part);return}const x=mode==='practice'?lessons[index]:examQuestions[index];card.className='card '+['blue','green','orange'][index%3];add('span','pill',mode==='exam'?'🎓 KLASSENARBEIT':'⚡ QUIZFRAGE');const part=add('div');if(mode==='practice')add('div','visual',lessons[index].icon,part);add('h2','question',x.q,part);const choices=add('div','choices',undefined,part);x.options.forEach((opt,i)=>{const b=add('button','choice',String.fromCharCode(65+i)+'  '+opt,choices);b.type='button';if(answers[index]){b.disabled=true;if(i===x.answer)b.classList.add('correct');if(answers[index].selected===i&&i!==x.answer)b.classList.add('wrong')}b.onclick=()=>{answers[index]={selected:i,correct:i===x.answer};render()}});if(answers[index]){const f=add('div','feedback'+(answers[index].correct?'':' bad'),undefined,part);add('strong','',answers[index].correct?'✓ Richtig!':'↻ Fast! Schau dir die Erklärung an.',f);add('div','',x.why,f)}else add('p','hint','Tippe auf die Antwort, die du richtig findest.',part)}
$('#next').addEventListener('click',()=>{const n=mode==='exam'?examQuestions.length:lessons.length;if(index<n&&(mode==='learn'||answers[index])){index++;render();card.scrollTop=0}});$('#prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('#reset').addEventListener('click',e=>{e.preventDefault();setMode('learn')});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('#mode-toggle').addEventListener('click',()=>{const m=$('#mode-options');m.hidden=!m.hidden;$('#mode-toggle').setAttribute('aria-expanded',String(!m.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.modebar')){$('#mode-options').hidden=true;$('#mode-toggle').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!$('#next').disabled)$('#next').click();if(e.key==='ArrowLeft'&&!$('#prev').disabled)$('#prev').click()});let touchX=0,touchY=0;card.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!$('#next').disabled)$('#next').click();else if(dx>0&&!$('#prev').disabled)$('#prev').click()}},{passive:true});setMode('learn');
</script></body></html>
